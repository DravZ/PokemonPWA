<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e3350d">
    <meta name="description" content="Explora y descubre Pokémon con Pokédex PWA.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pokédex | Pokémon PWA</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./images/icons/icon-192x192.png">
</head>
<body>
    <main>
        <header class="site-header">
            <a class="brand" href="./index.html" aria-label="Pokédex, inicio">
                <span class="brand-mark" aria-hidden="true">◉</span>
                <span>Pokédex</span>
            </a>
            <p class="header-caption">Tu guía del mundo Pokémon</p>
        </header>

        <section class="catalog" aria-labelledby="catalog-title">
            <div class="intro">
                <p class="eyebrow">Explora, descubre, colecciona</p>
                <h1 id="catalog-title">Todos los Pokémon</h1>
                <p class="intro-copy">Encuentra tu próximo favorito en la Pokédex.</p>
            </div>

            <label class="search-box" for="pokemon-search">
                <span aria-hidden="true">⌕</span>
                <input id="pokemon-search" type="search" placeholder="Buscar por nombre..." autocomplete="off">
            </label>

            <p id="catalog-status" class="catalog-status" role="status" aria-live="polite">Cargando Pokémon...</p>
            <div class="pokemon-grid" id="pokemon-list" aria-label="Pokémon ordenados alfabéticamente"></div>
            <button class="load-more" id="load-more" type="button" hidden>Mostrar más</button>
        </section>

        <footer class="site-footer">Datos e imágenes proporcionados por PokéAPI.</footer>
    </main>
    <script src="./js/app.js"></script>
</body>
</html>
